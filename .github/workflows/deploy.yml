# .github/workflows/deploy.yml — deploy validated main revisions to the VPS.
#
# Automatic deployment is triggered only after the `CI` workflow completes
# successfully for `main`. A manual workflow_dispatch remains available for an
# operator-controlled redeploy of the current main revision.
#
# Required GitHub secrets:
#   VPS_HOST       — VPS hostname or IP
#   VPS_USER       — SSH user (prefer a dedicated deploy user)
#   VPS_SSH_KEY    — private key for the deploy user
#
# Optional secrets:
#   VPS_PORT       — SSH port (default 22)
#   CONVEYOR_DEPLOY_PATH — repo root on VPS (default /opt/conveyor)
#
# Security:
#   - No secrets are hardcoded; all come from GitHub Actions secrets.
#   - The deploy script never prints .env.
#   - known_hosts is populated from the VPS fingerprint to prevent MITM.

name: Deploy to VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Resolve validated revision
        id: revision
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      # Pin the host key via a trusted, out-of-band fingerprint. ssh-keyscan
      # alone verifies nothing about the identity of the server.
      - name: Install pinned VPS SSH host key
        env:
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "${VPS_SSH_KNOWN_HOSTS}" || { echo "::error::VPS_SSH_KNOWN_HOSTS must be configured"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VPS_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via SSH (git-based)
        env:
          DEPLOY_PATH: ${{ secrets.CONVEYOR_DEPLOY_PATH || '/opt/conveyor' }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          DEPLOY_REF: ${{ steps.revision.outputs.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DEPLOY_SOURCE: github-actions
        run: |
          # The *old installed* deploy script is what runs during an automatic
          # upgrade. Explicitly reject legacy unfenced releases before doing
          # anything, otherwise a first auto-upgrade bypasses the new guard.
          ssh -o StrictHostKeyChecking=yes -p ${{ secrets.VPS_PORT || 22 }} \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "test -f ${DEPLOY_PATH}/scripts/deploy_db.py && grep -Fq 'deploy_db freeze' ${DEPLOY_PATH}/scripts/deploy_vps.sh && grep -Fq 'deploy_fence' ${DEPLOY_PATH}/handlers/job_queue.py && grep -Fq 'elif command in (\"freeze\", \"thaw\"):' ${DEPLOY_PATH}/scripts/deploy_db.py" \
              || { echo "::error::Live VPS release lacks atomic fencing; perform controlled first migration"; exit 1; }

          ssh -o StrictHostKeyChecking=yes -p ${{ secrets.VPS_PORT || 22 }} \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "GITHUB_SHA=${DEPLOY_SHA} GITHUB_REF_NAME=${DEPLOY_REF} GITHUB_RUN_ID=${GITHUB_RUN_ID} DEPLOY_SOURCE=${DEPLOY_SOURCE} CONVEYOR_DEPLOY_PATH=${DEPLOY_PATH} bash ${DEPLOY_PATH}/scripts/deploy_vps.sh"

      - name: Report failure
        if: failure()
        run: echo "::error::VPS deploy failed. Check the SSH step output above."
