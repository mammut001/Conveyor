# .github/workflows/deploy.yml — deploy validated main revisions to the VPS.
#
# Automatic deployment is triggered only after the `CI` workflow completes
# successfully for `main`. A manual workflow_dispatch remains available for an
# operator-controlled redeploy of the current main revision.
#
# Required GitHub secrets:
#   VPS_HOST       — VPS hostname or IP
#   VPS_USER       — SSH user (prefer a dedicated deploy user)
#   VPS_SSH_KEY    — private key for the deploy user
#
# Optional secrets:
#   VPS_PORT       — SSH port (default 22)
#   CONVEYOR_DEPLOY_PATH — repo root on VPS (default /opt/conveyor)
#
# Security:
#   - No secrets are hardcoded; all come from GitHub Actions secrets.
#   - The deploy script never prints .env.
#   - known_hosts is populated from the VPS fingerprint to prevent MITM.

name: Deploy to VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Resolve validated revision
        id: revision
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH (git-based)
        env:
          DEPLOY_PATH: ${{ secrets.CONVEYOR_DEPLOY_PATH || '/opt/conveyor' }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          DEPLOY_REF: ${{ steps.revision.outputs.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DEPLOY_SOURCE: github-actions
        run: |
          ssh -p ${{ secrets.VPS_PORT || 22 }} \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "GITHUB_SHA=${DEPLOY_SHA} GITHUB_REF_NAME=${DEPLOY_REF} GITHUB_RUN_ID=${GITHUB_RUN_ID} DEPLOY_SOURCE=${DEPLOY_SOURCE} CONVEYOR_DEPLOY_PATH=${DEPLOY_PATH} bash ${DEPLOY_PATH}/scripts/deploy_vps.sh"

      - name: Report failure
        if: failure()
        run: echo "::error::VPS deploy failed. Check the SSH step output above."
