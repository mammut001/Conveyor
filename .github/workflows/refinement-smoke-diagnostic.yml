name: Refinement smoke diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  dedupe-check:
    name: dedupe · ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        check:
          - _test_summary_branch_uses_strip_compare
          - _test_progress_already_sent_summary_is_not_resent
          - _test_progress_text_differs_from_summary_sends_both
          - _test_progress_summary_differ_sends_each_once
          - _test_placeholder_sent_exactly_once
          - _test_empty_prompt_returns_usage
    env:
      TELEGRAM_BOT_TOKEN: test-token
      TELEGRAM_ALLOWED_USER_ID: "12345"
      CODEX_WORKSPACE_ROOT: /tmp/conveyor-ci/workspace
      CODEX_TASK_ROOT: /tmp/conveyor-ci/tasks
      CODEX_MEMORY_ROOT: /tmp/conveyor-ci/memory
      CONVEYOR_ENV_FILE: .env.test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: mkdir -p "$CODEX_WORKSPACE_ROOT" "$CODEX_TASK_ROOT" "$CODEX_MEMORY_ROOT"
      - run: python -m pip install -r requirements.txt
      - name: Run selected assertion
        env:
          CHECK: ${{ matrix.check }}
        run: |
          python - <<'PY'
          import os
          import scripts.jobs_dedupe_smoke as smoke
          result = getattr(smoke, os.environ['CHECK'])()
          print(result)
          raise SystemExit(0 if result.ok else 1)
          PY
