name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Create smoke fixture
        shell: bash
        run: |
          cat > .env.test <<EOF
          TELEGRAM_BOT_TOKEN=ci-placeholder-token
          TELEGRAM_ALLOWED_USER_ID=1
          CODEX_WORKSPACE_ROOT=${GITHUB_WORKSPACE}
          CODEX_TASK_ROOT=${RUNNER_TEMP}/conveyor-task
          CODEX_MEMORY_ROOT=${RUNNER_TEMP}/conveyor-memory
          USER_TIMEZONE=UTC
          CONVEYOR_DESKTOP_AGENT_TOKEN=ci-desktop-placeholder-token
          EOF
          chmod 600 .env.test

      - name: Compile Python
        run: .venv/bin/python -m compileall -q .

      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Run smoke suite
        run: make smoke

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
