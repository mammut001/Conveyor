name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# greencloud's link to PyPI is slow and sometimes returns truncated JSON:
# retry, wait longer, and keep a pip cache on the host between runs.
env:
  PIP_RETRIES: "10"
  PIP_DEFAULT_TIMEOUT: "60"
  # Container jobs run with HOME=/github/home, so name the mounted cache explicitly.
  PIP_CACHE_DIR: /pip-cache

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    # Self-hosted on greencloud (GitHub-hosted minutes ran out). The repo is public:
    # never run fork PRs on our own machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, greencloud]
    container:
      image: python:3.11-bookworm
      # --init reaps killed children; without it zombies look "alive" to the
      # process-group lifecycle tests.
      options: --init
      volumes:
        - /home/ci/.cache/conveyor-pip-py311:/pip-cache
    # One unit-test pass plus smokes (~9 min); the all-flags pass is the backend-flags job.
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: test-token
      TELEGRAM_ALLOWED_USER_ID: "12345"
      CODEX_WORKSPACE_ROOT: /tmp/conveyor-ci/workspace
      CODEX_TASK_ROOT: /tmp/conveyor-ci/tasks
      CODEX_MEMORY_ROOT: /tmp/conveyor-ci/memory
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # The runner (uid ci) owns the checkout but the container runs as root;
      # without this git refuses the repo ("dubious ownership").
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create isolated test directories
        run: mkdir -p "$CODEX_WORKSPACE_ROOT" "$CODEX_TASK_ROOT" "$CODEX_MEMORY_ROOT"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Set up Node.js for bundled Pi
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install bundled Pi (vendor/pi)
        run: bash scripts/install_pi.sh

      - name: Compile Python
        run: .venv/bin/python -m compileall -q .

      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s tests -v


      - name: Run smoke suite
        run: make smoke

      - name: Feishu voice smoke
        run: .venv/bin/python scripts/feishu_audio_smoke.py

      - name: G4 authenticated browser smoke
        run: .venv/bin/python scripts/browser_auth_smoke.py

      - name: Browser autofill login smoke
        run: .venv/bin/python scripts/browser_login_smoke.py

      - name: PWA security smoke
        run: .venv/bin/python scripts/pwa_smoke.py

  backend-flags:
    name: Backend (all feature flags)
    # Self-hosted on greencloud (GitHub-hosted minutes ran out). The repo is public:
    # never run fork PRs on our own machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, greencloud]
    container:
      image: python:3.11-bookworm
      # --init reaps killed children; without it zombies look "alive" to the
      # process-group lifecycle tests.
      options: --init
      volumes:
        - /home/ci/.cache/conveyor-pip-py311:/pip-cache
    # The all-flags unit-test pass runs in parallel with Backend (~8 min each).
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: test-token
      TELEGRAM_ALLOWED_USER_ID: "12345"
      CODEX_WORKSPACE_ROOT: /tmp/conveyor-ci/workspace
      CODEX_TASK_ROOT: /tmp/conveyor-ci/tasks
      CODEX_MEMORY_ROOT: /tmp/conveyor-ci/memory
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # The runner (uid ci) owns the checkout but the container runs as root;
      # without this git refuses the repo ("dubious ownership").
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create isolated test directories
        run: mkdir -p "$CODEX_WORKSPACE_ROOT" "$CODEX_TASK_ROOT" "$CODEX_MEMORY_ROOT"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Set up Node.js for bundled Pi
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install bundled Pi (vendor/pi)
        run: bash scripts/install_pi.sh

      - name: Compile Python
        run: .venv/bin/python -m compileall -q .

      - name: Run unit tests with all CONVEYOR feature flags on
        # Only boolean feature switches: never set numeric limits, API keys,
        # hosts or the REQUIRE_REAL_BROWSER CI assertion switch to "1".
        # Deliberately exclude CONVEYOR_APPLY_ALLOW_HIGH_RISK and
        # CONVEYOR_COMPUTER_ALLOW_LOGIN_PASSWORDS: they enable risky actions.
        env:
          CONVEYOR_WEB_ENABLED: "1"
          CONVEYOR_CHAT_TOOLS: "1"
          CONVEYOR_CHAT_VISION: "1"
          CONVEYOR_DESKTOP_NODE_ENABLED: "1"
          CONVEYOR_DESKTOP_SCREENSHOT_ALLOW_UPLOAD: "1"
          CONVEYOR_DESKTOP_UPLOAD_ENABLED: "1"
          CONVEYOR_DESKTOP_AUTO_THUMBNAIL_ON_OBSERVE: "1"
          CONVEYOR_COMPUTER_USE_ENABLED: "1"
          CONVEYOR_COMPUTER_DIRECT_ENABLED: "1"
          CONVEYOR_COMPUTER_ALWAYS_DIRECT: "1"
          CONVEYOR_FEISHU_REQUIRE_ALLOWLIST: "1"
          CONVEYOR_TAKEOVER_ENABLED: "1"
          CONVEYOR_AGENTS_ENABLED: "1"
          CONVEYOR_NAMED_AGENTS: "1"
          CONVEYOR_AGENT_CONTEXT: "1"
          CONVEYOR_AGENT_MAILBOX: "1"
          CONVEYOR_AGENT_DELEGATION: "1"
          CONVEYOR_MAIN_ROUTER: "1"
          CONVEYOR_AGENT_CHANNEL_ROUTING: "1"
          # Transactional result outbox uses CHANNEL_ROUTING; no separate flag.
          # CONVEYOR_AGENTS_KILL intentionally OFF; emergency stop is tested separately.
          # Agent rate/queue/retention limits use safe defaults, not boolean flags.
          CONVEYOR_AGENT_DESKTOPS_ENABLED: "1"
          CONVEYOR_LIVE_SCREEN_ENABLED: "1"
          CONVEYOR_LIVE_SCREEN_CONTROL: "1"
          CONVEYOR_ROUTINES_ENABLED: "1"
          CONVEYOR_WEBHOOKS_ENABLED: "1"
          CONVEYOR_HOOKS_ENABLED: "1"
          CONVEYOR_MEMORY_V2: "1"
          CONVEYOR_LONG_TERM_MEMORY: "1"
          CONVEYOR_LONG_TERM_MEMORY_SHARED: "1"
          CONVEYOR_LONG_TERM_MEMORY_GROUPS: "1"
          CONVEYOR_APPROVAL_INBOX_ENABLED: "1"
          CONVEYOR_DRAFT_CARDS: "1"
          CONVEYOR_SKILLS_ENABLED: "1"
          CONVEYOR_WORKFLOWS_ENABLED: "1"
          CONVEYOR_ENV_ISOLATION: "1"
          CONVEYOR_CHILD_ENV_SCOPE_PROVIDER_KEYS: "1"
          CONVEYOR_EGRESS_PROXY: "1"
          CONVEYOR_WEB_MOBILE_UI: "1"
          CONVEYOR_PWA: "1"
          CONVEYOR_MCP_ENABLED: "1"
          CONVEYOR_APPROVAL_RELAY_ENABLED: "1"
          CONVEYOR_SUBAGENTS_ENABLED: "1"
          CONVEYOR_SUBAGENTS: "1"
          CONVEYOR_TEAMMATE_ENABLED: "1"
          CONVEYOR_REAL_BROWSER: "1"
          CONVEYOR_BROWSER_EXTERNAL_READONLY: "1"
          CONVEYOR_BROWSER_EXTERNAL_INTERACT: "1"
          CONVEYOR_BROWSER_EXTERNAL_SUBMIT: "1"
          CONVEYOR_BROWSER_AUTH_SESSIONS: "1"
          CONVEYOR_BROWSER_G5: "1"
          CONVEYOR_BROWSER_AUTOFILL_LOGIN: "1"
          CONVEYOR_BROWSER_G3_TELEGRAM_SCREENSHOT: "1"
          CONVEYOR_STT_ENABLED: "1"
          CONVEYOR_FEISHU_AUDIO: "1"
        run: .venv/bin/python -m unittest discover -s tests -v

  web:
    name: Web
    # Self-hosted on greencloud (GitHub-hosted minutes ran out). The repo is public:
    # never run fork PRs on our own machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, greencloud]
    # Match web/package-lock.json; browser/system dependencies are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run Web Workbench browser E2E
        run: npm run test:e2e

      # Flaky failures (e.g. r8-onboarding N27) only reproduce on CI runners: keep the
      # screenshot and page snapshot Playwright writes so the next failure is diagnosable.
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-test-results
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify chat interactions
        run: npm run test:chat

      # Blocking audit covers only what ships in web/dist; build tools are reported without failing (picomatch GHSA-fc5q-39xc-vjpf has no patched release yet).
      - name: Dependency audit (shipped dependencies)
        run: npm audit --audit-level=high --omit=dev
      - name: Dependency audit (build tools, report only)
        run: npm audit --audit-level=high || echo "::warning::build-tool dependencies have open advisories (not shipped in web/dist); see npm audit output above"

  real-browser:
    name: Local fixture Chromium (required)
    # Self-hosted on greencloud (GitHub-hosted minutes ran out). The repo is public:
    # never run fork PRs on our own machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, greencloud]
    # Keep the Python package and bundled Chromium build in sync.
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.0-noble
      options: --ipc=host
      volumes:
        - /home/ci/.cache/conveyor-pip-playwright:/pip-cache
    # Tests take ~4 min; the margin is for a cold cache on greencloud's
    # sometimes ~150 kB/s link to PyPI (the playwright wheel is 53 MB).
    timeout-minutes: 20
    env:
      CONVEYOR_REAL_BROWSER: "1"
      CONVEYOR_REQUIRE_REAL_BROWSER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Use the image's Python: host toolcache builds may link different OpenSSL versions.
      - name: Verify image Python TLS support
        run: /usr/bin/python3 -c "import ssl; print(ssl.OPENSSL_VERSION)"

      - name: Install Python dependencies and Playwright
        run: /usr/bin/python3 -m pip install -r requirements.txt "playwright==1.65.0" pytest pytest-timeout

      - name: Run real Chromium fixture integration tests (no skips)
        run: /usr/bin/python3 -m pytest tests/test_workflow_browser_playwright.py::LocalFixturePlaywrightTests tests/test_workflow_browser_guards.py tests/test_workflow_browser_external.py tests/test_workflow_browser_g2.py tests/test_web_browser_approvals.py tests/test_browser_agent_interact.py tests/test_workflow_browser_g3.py tests/test_browser_g2_g3_hardening.py tests/test_browser_auth_sessions.py tests/test_browser_autofill_login.py tests/test_browser_g5_rollout.py -q -v --timeout=20 --timeout-method=thread
