name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: test-token
      TELEGRAM_ALLOWED_USER_ID: "12345"
      CODEX_WORKSPACE_ROOT: /tmp/conveyor-ci/workspace
      CODEX_TASK_ROOT: /tmp/conveyor-ci/tasks
      CODEX_MEMORY_ROOT: /tmp/conveyor-ci/memory
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Create isolated test directories
        run: mkdir -p "$CODEX_WORKSPACE_ROOT" "$CODEX_TASK_ROOT" "$CODEX_MEMORY_ROOT"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Compile Python
        run: .venv/bin/python -m compileall -q .

      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Run unit tests with all CONVEYOR feature flags on
        # Only boolean feature switches: never set numeric limits, API keys,
        # hosts or the REQUIRE_REAL_BROWSER CI assertion switch to "1".
        # Deliberately exclude CONVEYOR_APPLY_ALLOW_HIGH_RISK and
        # CONVEYOR_COMPUTER_ALLOW_LOGIN_PASSWORDS: they enable risky actions.
        env:
          CONVEYOR_WEB_ENABLED: "1"
          CONVEYOR_CHAT_TOOLS: "1"
          CONVEYOR_CHAT_VISION: "1"
          CONVEYOR_DESKTOP_NODE_ENABLED: "1"
          CONVEYOR_DESKTOP_SCREENSHOT_ALLOW_UPLOAD: "1"
          CONVEYOR_DESKTOP_UPLOAD_ENABLED: "1"
          CONVEYOR_DESKTOP_AUTO_THUMBNAIL_ON_OBSERVE: "1"
          CONVEYOR_COMPUTER_USE_ENABLED: "1"
          CONVEYOR_COMPUTER_DIRECT_ENABLED: "1"
          CONVEYOR_COMPUTER_ALWAYS_DIRECT: "1"
          CONVEYOR_FEISHU_REQUIRE_ALLOWLIST: "1"
          CONVEYOR_TAKEOVER_ENABLED: "1"
          CONVEYOR_AGENTS_ENABLED: "1"
          CONVEYOR_AGENT_DESKTOPS_ENABLED: "1"
          CONVEYOR_LIVE_SCREEN_ENABLED: "1"
          CONVEYOR_LIVE_SCREEN_CONTROL: "1"
          CONVEYOR_ROUTINES_ENABLED: "1"
          CONVEYOR_WEBHOOKS_ENABLED: "1"
          CONVEYOR_HOOKS_ENABLED: "1"
          CONVEYOR_MEMORY_V2: "1"
          CONVEYOR_LONG_TERM_MEMORY: "1"
          CONVEYOR_LONG_TERM_MEMORY_SHARED: "1"
          CONVEYOR_LONG_TERM_MEMORY_GROUPS: "1"
          CONVEYOR_APPROVAL_INBOX_ENABLED: "1"
          CONVEYOR_DRAFT_CARDS: "1"
          CONVEYOR_SKILLS_ENABLED: "1"
          CONVEYOR_WORKFLOWS_ENABLED: "1"
          CONVEYOR_ENV_ISOLATION: "1"
          CONVEYOR_CHILD_ENV_SCOPE_PROVIDER_KEYS: "1"
          CONVEYOR_EGRESS_PROXY: "1"
          CONVEYOR_WEB_MOBILE_UI: "1"
          CONVEYOR_PWA: "1"
          CONVEYOR_MCP_ENABLED: "1"
          CONVEYOR_APPROVAL_RELAY_ENABLED: "1"
          CONVEYOR_SUBAGENTS_ENABLED: "1"
          CONVEYOR_SUBAGENTS: "1"
          CONVEYOR_TEAMMATE_ENABLED: "1"
          CONVEYOR_REAL_BROWSER: "1"
          CONVEYOR_BROWSER_EXTERNAL_READONLY: "1"
          CONVEYOR_BROWSER_EXTERNAL_INTERACT: "1"
          CONVEYOR_BROWSER_EXTERNAL_SUBMIT: "1"
          CONVEYOR_BROWSER_AUTH_SESSIONS: "1"
          CONVEYOR_BROWSER_AUTOFILL_LOGIN: "1"
          CONVEYOR_BROWSER_G3_TELEGRAM_SCREENSHOT: "1"
          CONVEYOR_STT_ENABLED: "1"
          CONVEYOR_FEISHU_AUDIO: "1"
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Run smoke suite
        run: make smoke

      - name: Feishu voice smoke
        run: .venv/bin/python scripts/feishu_audio_smoke.py

      - name: G4 authenticated browser smoke
        run: .venv/bin/python scripts/browser_auth_smoke.py

      - name: Browser autofill login smoke
        run: .venv/bin/python scripts/browser_login_smoke.py

      - name: PWA security smoke
        run: .venv/bin/python scripts/pwa_smoke.py

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run Web Workbench browser E2E
        run: npm run test:e2e

      - name: Dependency audit
        run: npm audit --audit-level=high

  real-browser:
    name: Local fixture Chromium (required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONVEYOR_REAL_BROWSER: "1"
      CONVEYOR_REQUIRE_REAL_BROWSER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies and Playwright
        run: python -m pip install -r requirements.txt "playwright>=1.48,<2" pytest pytest-timeout

      - name: Install real Chromium and OS dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run real Chromium fixture integration tests (no skips)
        run: python -m pytest tests/test_workflow_browser_playwright.py::LocalFixturePlaywrightTests tests/test_workflow_browser_guards.py tests/test_workflow_browser_external.py tests/test_workflow_browser_g2.py tests/test_web_browser_approvals.py tests/test_browser_agent_interact.py tests/test_workflow_browser_g3.py tests/test_browser_g2_g3_hardening.py tests/test_browser_auth_sessions.py tests/test_browser_autofill_login.py -q -v --timeout=20 --timeout-method=thread
