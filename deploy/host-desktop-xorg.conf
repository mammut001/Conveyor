# Conveyor host desktop: a headless X server that exists from boot, so the
# desktop does not depend on someone logging in over RDP first.
# Install as /etc/X11/conveyor/xorg.conf (see docs/host_desktop.md).
#
# Input devices are added automatically, including the uinput devices that
# computer use creates — the same way the xrdp X configuration handled them.
Section "ServerLayout"
    Identifier "Conveyor"
    Screen "Screen"
EndSection

Section "ServerFlags"
    Option "DontVTSwitch" "on"
    Option "AutoAddDevices" "on"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Monitor"
    Identifier "Monitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "1920x1080" 138.500 1920 1968 2000 2080 1080 1083 1088 1111 +hsync -vsync
    Modeline "1600x900" 119.00 1600 1696 1864 2128 900 901 904 932 -hsync +vsync
    Modeline "1440x900" 106.50 1440 1528 1672 1904 900 903 909 934 -hsync +vsync
    Modeline "1280x720" 74.25 1280 1720 1760 1980 720 725 730 750 +hsync +vsync
EndSection

Section "Device"
    Identifier "Card"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Screen"
    Identifier "Screen"
    Device "Card"
    Monitor "Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1600x900" "1920x1080" "1440x900" "1280x720"
        Virtual 1920 1080
    EndSubSection
EndSection
